# T27 — the whole stack in one command:
#
#     cp .env.example .env      (then fill in the two secrets)
#     docker compose up --build
#
#     app  → http://localhost:8080
#     api  → http://localhost:8000/docs
#     mq   → http://localhost:15672  (guest / guest)
#
# Every service that others depend on has a healthcheck, and the dependants
# wait for `service_healthy` rather than `service_started`. Without that the
# backend races Postgres on a cold start and dies before the DB accepts
# connections.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobtracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobtracker}
      POSTGRES_DB: ${POSTGRES_DB:-jobtracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Exposed so you can point psql or a GUI at it during development.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobtracker} -d ${POSTGRES_DB:-jobtracker}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # appendonly keeps the cache across restarts. Not strictly needed — the
    # stats cache rebuilds itself — but it makes restarts less surprising.
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI — useful for showing the queue in a demo
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      # RabbitMQ is the slowest of the three to boot; start_period stops the
      # early failures from counting against the retry budget.
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./job-tracker/backend
    # Migrations run before the API accepts traffic. `alembic upgrade head` is
    # idempotent, so this is safe on every start, not just the first.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      # Hostnames are the compose service names. These are real environment
      # variables, which pydantic-settings prefers over the .env file baked
      # into the image — and .env is excluded by .dockerignore anyway.
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobtracker}:${POSTGRES_PASSWORD:-jobtracker}@postgres:5432/${POSTGRES_DB:-jobtracker}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      JWT_Secret_Key: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
      EMAILS_ENABLED: ${EMAILS_ENABLED:-False}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      # python rather than curl: the slim image has no curl, and adding one
      # just for a healthcheck is a wasted layer.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    # Same image as the backend, different process. This is the consumer side
    # of RabbitMQ — it sends the interview-reminder emails and is deliberately
    # not part of the API process.
    build:
      context: ./job-tracker/backend
    command: python -m app.workers.notification_worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobtracker}:${POSTGRES_PASSWORD:-jobtracker}@postgres:5432/${POSTGRES_DB:-jobtracker}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      JWT_Secret_Key: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      EMAILS_ENABLED: ${EMAILS_ENABLED:-False}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    depends_on:
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build:
      context: ./job-tracker/frontend
    ports:
      - "8080:80"
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
