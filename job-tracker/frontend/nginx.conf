server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are immutable — a change produces a new name, so
    # these can be cached hard. index.html must never be, or a deploy can be
    # invisible to a returning visitor.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # REST. The client calls /api/auth/login; the trailing slash on proxy_pass
    # strips the /api prefix, so the backend sees /auth/login. Serving the API
    # from this same origin is also why the app needs no CORS in production.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket. The Upgrade/Connection pair is what turns this into a socket
    # rather than a normal proxied request; without them the handshake 400s.
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # The app pings every 25s; this must stay comfortably above that or
        # nginx will cut an otherwise healthy connection.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback. React Router owns /app/applications/:id etc., and a hard
    # refresh on one of those must return index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
